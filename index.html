<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Módulo 3 Unidad 3</title>
</head>
<body>
    <h1>Ejercicio 1: Calculador de Promedios (Historia)</h1>
    <div>
        <label for="nota1">Nota Parcial 1:</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ej: 8">
    </div>
    <br>
    <div>
        <label for="nota2">Nota Parcial 2:</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ej: 6">
    </div>
    <br>
    <button id="btnCalcular">Calcular Promedio</button>
    <h2 id="resultado"></h2>

    <hr>

    <h1>Ejercicio 2: Contador de Caracteres en Tiempo Real</h1>
    <textarea id="mensaje" rows="5" cols="50" placeholder="Escribí tu mensaje acá..."></textarea>
    <p id="contador">Caracteres ingresados: 0</p>

    <script src="js/ejercicio1.js"></script>
    <script src="js/ejercicio2.js"></script>
</body>
</html>
